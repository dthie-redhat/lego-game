services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: pick-a-brick-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pickabrick}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pickabrick}
      POSTGRES_DB: ${POSTGRES_DB:-pickabrick}
    volumes:
      - pick-a-brick-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pickabrick} -d ${POSTGRES_DB:-pickabrick}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Containerfile
    container_name: pick-a-brick-app
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-pickabrick}:${POSTGRES_PASSWORD:-pickabrick}@db:5432/${POSTGRES_DB:-pickabrick}
      DEFAULT_TOTAL_BRICKS: ${DEFAULT_TOTAL_BRICKS:-100}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pick-a-brick-data:
